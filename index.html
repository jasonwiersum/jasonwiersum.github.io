<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Jason Wiersum | Anwendungsentwickler</title>
    <meta
      name="description"
      content="Jason Wiersum | IHK-zertifizierter Anwendungsentwickler aus Nürnberg. Software, Design und Kreativität in einem Profil."
    />
    <meta name="author" content="Jason Wiersum" />
    <meta name="theme-color" content="#d6e3ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jason Wiersum" />
    <meta property="og:title" content="Jason Wiersum | Anwendungsentwickler" />
    <meta
      property="og:description"
      content="Anwendungsentwickler (IHK) aus Nürnberg mit Hintergrund im Industriedesign. Software · Design · Kreativität."
    />
    <meta property="og:locale" content="de" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jason Wiersum | Anwendungsentwickler" />
    <meta
      name="twitter:description"
      content="Anwendungsentwickler (IHK) aus Nürnberg mit Hintergrund im Industriedesign. Software · Design · Kreativität."
    />

    <!-- An ICO as well as the SVG: Chromium-based browsers (Brave among them)
         fall back to favicon.ico in contexts that never take an SVG, which is
         why the tab came up blank there. %BASE_URL% rather than "./" so the
         path is absolute but still correct when BASE_PATH moves the site. -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Applies the stored theme before first paint so the page never flashes the
      wrong background. Mirrors the default in src/hooks/useTheme.tsx (light).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('jw-theme')
          var theme = stored === 'dark' || stored === 'light' ? stored : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
        try {
          var lang = localStorage.getItem('jw-language')
          if (lang === 'es' || lang === 'en' || lang === 'de') {
            document.documentElement.lang = lang
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Safety net. If the app has not mounted after a few seconds, explain why
      instead of leaving a blank white page.

      The most common cause is a GitHub Pages misconfiguration: when "Source" is
      set to "Deploy from a branch", Pages publishes the repository *as-is*, so
      the browser receives this file with its development entry point
      (`/src/main.tsx`) and nothing can run. That case is detected precisely and
      named, because a white page gives no clue on its own.
    -->
    <script>
      ;(function () {
        setTimeout(function () {
          var root = document.getElementById('root')
          if (!root || root.children.length > 0) return

          var servingSource = !!document.querySelector('script[src*="/src/main.tsx"]')
          var body = servingSource
            ? '<p><strong>GitHub Pages is serving the repository source instead of the build.</strong></p>' +
              '<p>Open <em>Settings &rarr; Pages</em> and set <em>Source</em> to <em>GitHub Actions</em>, ' +
              'then re-run the &ldquo;Deploy to GitHub Pages&rdquo; workflow.</p>'
            : '<p><strong>The application failed to load.</strong></p>' +
              '<p>Check the browser console for the underlying error.</p>'

          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
            'padding:2rem;font:15px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;' +
            'color:#0f1424;background:#d6e3ff;text-align:center">' +
            '<div style="max-width:34rem">' +
            '<p style="font:500 11px/1 ui-monospace,monospace;letter-spacing:.14em;' +
            'text-transform:uppercase;color:#6a7490;margin:0 0 1rem">Jason Wiersum</p>' +
            body +
            '</div></div>'
        }, 4000)
      })()
    </script>
  </body>
</html>
