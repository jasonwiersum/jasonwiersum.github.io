<svg xmlns="http://www.w3.org/2000/svg" viewBox="-23 -16 136 128" role="img" aria-label="QuickBite">
  <!--
    QuickBite. A ring with a bite taken out of it, and two motion dashes coming
    in from the left: the bite, and the speed it arrives at.

    One colour throughout, and the bite is a real hole rather than a shape
    painted in the background colour — so the mark sits on the light and the
    dark cover alike without a second file. #4c7cff is the accent of both
    themes met in the middle: 3.4:1 on the light cover, 5.5:1 on the dark one.
  -->
  <defs>
    <mask id="qb-bite">
      <rect x="-23" y="-16" width="136" height="128" fill="#fff"/>
      <circle cx="80" cy="24" r="17" fill="#000"/>
    </mask>
  </defs>

  <g fill="none" stroke="#4c7cff" stroke-width="9" stroke-linecap="round">
    <g mask="url(#qb-bite)">
      <circle cx="58" cy="50" r="28"/>
    </g>
    <path d="M4 36h16"/>
    <path d="M12 64h12"/>
  </g>

  <circle cx="58" cy="50" r="7" fill="#4c7cff"/>
</svg>
