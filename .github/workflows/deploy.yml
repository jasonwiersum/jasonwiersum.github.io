name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:
  # Re-publishes the site once a day so the CV carries the current date. The
  # PDF in the repository is never touched — see the stamping step below.
  #
  # 23:00 UTC and not 00:00, because this scheduler runs in UTC and the CV is
  # dated in Germany. Berlin is an hour ahead in winter and two in summer, so
  # 23:00 UTC is midnight there in winter and 01:00 in summer: in both, the
  # German day being stamped has already started. Running at 00:00 UTC would,
  # for half the year, date the document a day ahead of Germany.
  #
  # GitHub delays scheduled runs under load, sometimes by half an hour. That
  # only ever pushes it further into the same German day, so it stays correct.
  schedule:
    - cron: '0 23 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs replace each other rather than racing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Vite base path is derived from the repository itself, so nothing in
      # the code has to know the repository's name or URL:
      #   <owner>.github.io  -> served at "/"
      #   any other repo     -> served at "/<repo>/"
      #
      # The full origin comes out of the same two names. The sitemap and the
      # social preview both need it — a sitemap has to carry absolute URLs and
      # a scraper fetches og:image from its own machine, with no page to
      # resolve a path against — and this is the one place that already knows
      # the host without anybody having written it down.
      - name: Resolve base path
        id: base
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          repo_lc="$(echo "$repo" | tr '[:upper:]' '[:lower:]')"
          owner_lc="$(echo "$owner" | tr '[:upper:]' '[:lower:]')"
          if [ "$repo_lc" = "${owner_lc}.github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo/" >> "$GITHUB_OUTPUT"
          fi
          echo "url=https://${owner_lc}.github.io$(
            [ "$repo_lc" = "${owner_lc}.github.io" ] && echo "/" || echo "/$repo/"
          )" >> "$GITHUB_OUTPUT"

      # sitemap.xml carries the commit's date, not the build's, so the nightly
      # CV rebuild does not move it. `fetch-depth: 0` is not needed for that —
      # the checkout above leaves the head commit, which is the one being
      # published.
      # GITHUB_TOKEN is here only for the rate limit. The build reads the public
      # repositories behind the projects through the GitHub API (see the
      # `repo-status` plugin), and an unauthenticated runner shares its IP —
      # and its 60 requests an hour — with every other job on that machine.
      # The token Actions issues for this run lifts that to 1,000 an hour, and
      # needs no scope beyond the `contents: read` already granted above.
      - name: Build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          SITE_URL: ${{ steps.base.outputs.url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      # Only the built copy is stamped. The PDF in the repository stays exactly
      # as it came out of Word: rewriting it would swap a hand-made export for
      # a tool's re-save, and the next export would then diff against
      # something nobody wrote. Stamping the copy also means the ~37 kB that
      # re-embedding the font costs is paid once per build rather than
      # accumulating.
      #
      # A glob rather than the filename, so renaming the CV does not silently
      # stop this. The script leaves anything it does not recognise alone and
      # never fails the build — a date is not worth blocking a deploy over, so
      # watch this step's log if the date ever looks stale.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stamp today's date on the CV
        run: |
          python -m pip install --quiet pymupdf
          shopt -s nullglob
          for pdf in dist/cv/*.pdf; do
            python scripts/stamp-cv-date.py "$pdf"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
